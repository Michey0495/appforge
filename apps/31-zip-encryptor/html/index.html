<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ZIP暗号化デスクトップ - プレビュー</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background: #fff; color: #222; max-width: 720px; margin: 60px auto; padding: 0 24px; line-height: 1.7; }
  h1 { font-size: 22px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
  .note { background: #f7f7f7; border: 1px solid #eee; padding: 16px; border-radius: 4px; font-size: 13px; color: #555; }
  code { background: #f0f0f0; padding: 2px 6px; border-radius: 2px; font-size: 12px; }
  a { color: #2c52a4; }
</style>
</head>
<body>
<h1>ZIP暗号化デスクトップ</h1>
<p>本アプリは Win/Mac 向けのデスクトップアプリです。ブラウザ上では動作しません。</p>
<div class="note">
  <p><strong>動作確認の手順</strong></p>
  <ol>
    <li>Tauri CLI をインストール (<code>cargo install tauri-cli</code>)</li>
    <li>プロジェクトルートで <code>cargo tauri dev</code></li>
    <li>ビルド時は <code>cargo tauri build</code> で .exe / .dmg を生成</li>
  </ol>
  <p>プロンプトをAIに渡して、Tauriプロジェクト雛形から実装を始めてください。</p>
</div>
</body>
</html>
