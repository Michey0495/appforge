<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>フルページスクリーンショット拡張 - プレビュー</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background: #fff; color: #222; max-width: 720px; margin: 60px auto; padding: 0 24px; line-height: 1.7; }
  h1 { font-size: 22px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
  .note { background: #f7f7f7; border: 1px solid #eee; padding: 16px; border-radius: 4px; font-size: 13px; color: #555; }
  code { background: #f0f0f0; padding: 2px 6px; border-radius: 2px; font-size: 12px; }
</style>
</head>
<body>
<h1>フルページスクリーンショット拡張</h1>
<p>本ツールは Chrome 拡張機能です。ブラウザの拡張機能管理ページから読み込んで使用します。</p>
<div class="note">
  <p><strong>読み込み手順</strong></p>
  <ol>
    <li><code>chrome://extensions</code> を開く</li>
    <li>右上の「デベロッパーモード」を ON</li>
    <li>「パッケージ化されていない拡張機能を読み込む」で拡張機能フォルダを選択</li>
  </ol>
</div>
</body>
</html>
